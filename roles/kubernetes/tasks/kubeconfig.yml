---
# Rôle kubernetes — Validation des secrets, installation kubectl et déploiement kubeconfig
# Ordre : assert secrets → installer kubectl → créer .kube → déployer kubeconfig → vérifier permissions

# === Validation pré-déploiement ===

- name: Valider que les secrets K8s sont fournis
  ansible.builtin.assert:
    that:
      - jarod_sa_token is defined
      - jarod_sa_token | length > 0
      - k8s_ca_data is defined
      - k8s_ca_data | length > 0
    fail_msg: >-
      Les variables jarod_sa_token et k8s_ca_data sont requises.
      Injectez-les via --extra-vars depuis GitHub Secrets.
    success_msg: "Secrets K8s validés (token et CA présents)"

# === Installation kubectl ===

- name: Vérifier si kubectl est installé
  ansible.builtin.command:
    cmd: kubectl version --client
  register: kubectl_check
  changed_when: false
  failed_when: false

- name: Installer kubectl si absent
  when: kubectl_check.rc != 0
  block:
    - name: Télécharger kubectl {{ kubectl_version }}
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
      retries: 3
      delay: 5
      register: kubectl_download
      until: kubectl_download is success

    - name: Valider l'installation kubectl
      ansible.builtin.command:
        cmd: kubectl version --client
      changed_when: false

# === Déploiement kubeconfig ===

- name: Créer le répertoire .kube
  ansible.builtin.file:
    path: "{{ kube_dir }}"
    state: directory
    owner: "{{ jarod_user }}"
    group: "{{ jarod_user }}"
    mode: "{{ kube_dir_mode }}"

- name: Déployer le kubeconfig
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "{{ kube_config_file }}"
    owner: "{{ jarod_user }}"
    group: "{{ jarod_user }}"
    mode: "{{ kube_config_mode }}"
  no_log: true

# === Vérification post-déploiement ===

- name: Vérifier les permissions du kubeconfig
  ansible.builtin.stat:
    path: "{{ kube_config_file }}"
  register: kubeconfig_stat
  changed_when: false

- name: Valider permissions kubeconfig (600, owner jarod)
  ansible.builtin.assert:
    that:
      - kubeconfig_stat.stat.exists
      - kubeconfig_stat.stat.mode == "0600"
      - kubeconfig_stat.stat.pw_name == jarod_user
    fail_msg: "Le kubeconfig n'a pas les permissions attendues (600, owner {{ jarod_user }})"
    success_msg: "Kubeconfig déployé — permissions correctes (600, owner {{ jarod_user }})"

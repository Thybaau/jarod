---
# Valeurs par défaut — rôle hermes

# === Identité utilisateur ===
hermes_user: "{{ jarod_user }}"
hermes_home: "{{ jarod_home }}"
hermes_env_file: "{{ jarod_home }}/.hermes/.env"
hermes_env_mode: "0600"

# === Installation Hermes ===
hermes_install_script_url: "https://hermes-agent.nousresearch.com/install.sh"
hermes_install_dir: "{{ hermes_home }}/.hermes/hermes-agent"
hermes_bin: "{{ hermes_home }}/.local/bin/hermes"
hermes_data_dir: "{{ hermes_home }}/.hermes"
hermes_skip_browser: true

# === Configuration LLM ===
hermes_config_file: "{{ hermes_data_dir }}/config.yaml"
hermes_model_provider: "deepseek"
hermes_model_default: "deepseek-v4-flash"

# === Fallback LLM ===
hermes_fallback_provider: "openrouter"
hermes_fallback_model: "deepseek/deepseek-v4-flash"

# === Compression du contexte ===
hermes_compression_enabled: true
hermes_compression_threshold: 0.50
hermes_compression_target_ratio: 0.20

# === Persona JAROD ===
hermes_soul_file: "{{ hermes_data_dir }}/SOUL.md"
hermes_operator_title: "Monsieur"

# === Sécurité et approbations ===
hermes_approvals_mode: "manual"
hermes_approvals_timeout: 300
hermes_approvals_cron_mode: "deny"
hermes_approvals_deny:
  - "kubectl delete namespace *"
  - "kubectl drain *"
  - "kubectl cordon *"
  - "kubectl delete node *"
  - "systemctl stop hermes*"
  - "systemctl disable hermes*"
  - "ufw disable"
  - "rm -rf /home/jarod/.hermes*"
  - "rm -rf /home/jarod/.kube*"

# === Service systemd ===
hermes_service_name: hermes-gateway
hermes_service_file: "/etc/systemd/system/hermes-gateway.service"
hermes_gateway_command: "gateway run"
hermes_restart_sec: 10
hermes_watchdog_sec: 300
hermes_memory_max: "2G"

# === Discord Gateway ===
hermes_discord_require_mention: true
hermes_discord_auto_thread: true
hermes_discord_home_channel: ""
hermes_discord_free_response_channels: ""
hermes_discord_reactions: true
hermes_discord_home_channel_id: ""
hermes_discord_home_channel_name: ""
hermes_discord_server_id: ""

# === Discord — Commandes slash et channel overrides ===
hermes_discord_command_sync_policy: "safe"
hermes_discord_channel_prompts: {}
hermes_discord_admin_user_id: ""

# === Voice — Speech-to-Text ===
hermes_stt_provider: "local"
hermes_stt_language: "fr"
hermes_stt_local_model: "small"
hermes_stt_initial_prompt: "JAROD"

# === Voice — Text-to-Speech ===
hermes_tts_provider: "edge"
hermes_tts_speed: 1.0
hermes_tts_edge_voice: "fr-FR-HenriNeural"

# === Mémoire persistante ===
hermes_memory_enabled: true
hermes_memory_user_profile_enabled: true
hermes_memory_char_limit: 2200
hermes_memory_user_char_limit: 1375
hermes_memory_write_approval: false

# === Skills et apprentissage ===
hermes_skills_write_approval: false
hermes_skills_external_dirs: []

# === Background review (auto-apprentissage) ===
hermes_background_review_enabled: true
hermes_background_review_provider: ""
hermes_background_review_model: ""

# === Notifications mémoire ===
hermes_display_memory_notifications: "on"

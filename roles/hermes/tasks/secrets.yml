---
# Déploiement du fichier .env avec les secrets
# Les variables sont injectées via --extra-vars depuis le CI/CD (GitHub Secrets)

- name: Créer le répertoire home si nécessaire
  ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "0755"

- name: Déployer le fichier .env avec les secrets
  ansible.builtin.template:
    src: dot-env.j2
    dest: "{{ hermes_env_file }}"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "{{ hermes_env_mode }}"
  no_log: true

- name: Vérifier les permissions du fichier .env
  ansible.builtin.stat:
    path: "{{ hermes_env_file }}"
  register: env_file_stat
  changed_when: false

- name: Valider que le fichier .env a les permissions correctes
  ansible.builtin.assert:
    that:
      - env_file_stat.stat.exists
      - env_file_stat.stat.mode == "0600"
      - env_file_stat.stat.pw_name == hermes_user
    fail_msg: "Le fichier .env n'a pas les permissions attendues (600, owner {{ hermes_user }})"
    success_msg: "Fichier .env déployé avec permissions correctes (600, owner {{ hermes_user }})"

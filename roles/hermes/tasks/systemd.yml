---
# Déploiement du service systemd hermes-gateway
# Le service est enabled mais PAS started — le démarrage sera déclenché
# en story 2.2 quand config.yaml sera en place

- name: Déployer le service unit hermes-gateway
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_service_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart hermes-gateway

- name: Recharger la configuration systemd (daemon-reload)
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Activer le service hermes-gateway (sans démarrer)
  ansible.builtin.systemd:
    name: "{{ hermes_service_name }}"
    enabled: true
  become: true
  # Note : le service n'est PAS démarré ici volontairement.
  # Sans config.yaml (story 2.2), Hermes échouerait au boot.
  # Le handler 'Restart hermes-gateway' sera déclenché par la story 2.2
  # lors du déploiement de la configuration.

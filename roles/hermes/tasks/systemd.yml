---
# Déploiement du service systemd hermes-gateway

- name: Déployer le service unit hermes-gateway
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "{{ hermes_service_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart hermes-gateway

- name: Recharger la configuration systemd (daemon-reload)
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Activer et démarrer le service hermes-gateway
  ansible.builtin.systemd:
    name: "{{ hermes_service_name }}"
    enabled: true
    state: started
  become: true

---
# Rôle hermes — Orchestration des tasks
# Ordre : secrets → install → config → systemd

- name: Déployer les secrets (.env)
  ansible.builtin.include_tasks: secrets.yml
  tags: [hermes, secrets]

- name: Installer Hermes Agent
  ansible.builtin.include_tasks: install.yml
  tags: [hermes, install]

- name: Configurer Hermes (config.yaml)
  ansible.builtin.include_tasks: config.yml
  tags: [hermes, config]

- name: Déployer la persona (SOUL.md)
  ansible.builtin.include_tasks: soul.yml
  tags: [hermes, soul]

- name: Configurer le service systemd
  ansible.builtin.include_tasks: systemd.yml
  tags: [hermes, systemd]
